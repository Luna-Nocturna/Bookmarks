<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Menu Editor</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #121212;
      color: #e0e0e0;
      font-size: 16px;
    }

    button {
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 16px;
      background-color: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      cursor: pointer;
    }

    button:hover {
      background-color: #444;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    input {
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 16px;
      background-color: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #333;
    }

    /* ---------------------- Login ---------------------- */

    #login-screen {
      max-width: 420px;
      margin: 80px auto;
      padding: 25px;
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
    }

    #login-screen h1 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .login-field {
      margin-bottom: 15px;
    }

    .login-field label {
      display: block;
      margin-bottom: 5px;
    }

    .login-field input {
      box-sizing: border-box;
      width: 100%;
    }

    #login-btn {
      width: 100%;
      margin-top: 5px;
      padding: 7px 10px;
    }

    #login-status {
      margin-top: 15px;
      min-height: 20px;
    }

    /* ---------------------- Editor ---------------------- */

    #editor-screen {
      display: none;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .editor-header h1 {
      margin: 0;
    }

    #logout-btn {
      margin-left: 15px;
    }

    .tree ul {
      list-style-type: none;
      padding-left: 20px;
      margin: 0;
    }

    .tree li {
      margin: 10px 0;
      /* keep normal vertical stacking */
    }

    .node-buttons-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .up-down-buttons {
      display: flex;
      flex-direction: row;
      gap: 4px;
    }

    .node-buttons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .node-buttons input {
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 16px;
      background-color: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #333;
    }

    .link-input {
      width: 750px;
    }

    #add-top-btn {
      margin-bottom: 15px;
    }

    #save-btn {
      margin-top: 15px;
    }

    #editor-status {
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <!-- ================================================== -->
  <!-- Login Screen -->
  <!-- ================================================== -->

  <div id="login-screen">

    <h1>GitHub Login</h1>

    <form id="login-form" autocomplete="on">

      <div class="login-field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          value="Luna-Nocturna"
          autocomplete="username"
          readonly
        >
      </div>

      <div class="login-field">
        <label for="password">GitHub Token</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          spellcheck="false"
        >
      </div>

      <button type="submit" id="login-btn">Login</button>

      <div id="login-status"></div>

    </form>

  </div>


  <!-- ================================================== -->
  <!-- Editor Screen -->
  <!-- ================================================== -->

  <div id="editor-screen">

    <div class="editor-header">
      <h1>Menu Editor</h1>
      <button id="logout-btn" type="button">Logout</button>
    </div>

    <button id="add-top-btn" type="button">Add Top Category</button>

    <div class="tree" id="menu-tree"></div>

    <button id="save-btn" type="button">Save Menu</button>

    <div id="editor-status"></div>

  </div>


  <script>

    // ==================================================
    // GitHub Configuration
    // ==================================================

    const GITHUB_OWNER = "Luna-Nocturna";
    const GITHUB_REPO  = "Bookmarks";
    const GITHUB_PATH  = "menu.html";

    // The token is deliberately NOT stored here.
    // It exists only in memory after successful login.
    let githubToken = null;

    let currentSha = null;
    let menuData = [];


    // ==================================================
    // DOM Elements
    // ==================================================

    const loginScreen = document.getElementById("login-screen");
    const editorScreen = document.getElementById("editor-screen");

    const loginForm = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("login-btn");
    const loginStatus = document.getElementById("login-status");

    const logoutButton = document.getElementById("logout-btn");
    const saveButton = document.getElementById("save-btn");
    const addTopButton = document.getElementById("add-top-btn");
    const editorStatus = document.getElementById("editor-status");


    // ==================================================
    // Login
    // ==================================================

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const token = passwordInput.value.trim();

      if (!token) {
        loginStatus.textContent = "Please enter your GitHub token.";
        return;
      }

      loginButton.disabled = true;
      passwordInput.disabled = true;

      loginStatus.textContent = "Checking GitHub credentials...";

      try {

        // Test the credentials by requesting the menu file.
        const response = await fetch(
          `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`,
          {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Accept": "application/vnd.github+json"
            }
          }
        );

        if (!response.ok) {

          let message = `GitHub returned HTTP ${response.status}.`;

          try {
            const errorData = await response.json();

            if (errorData.message) {
              message += ` ${errorData.message}`;
            }
          } catch {
            // Ignore JSON parsing errors.
          }

          throw new Error(message);
        }

        // Credentials are valid.
        githubToken = token;

        // Clear the visible password field.
        passwordInput.value = "";

        loginStatus.textContent = "";

        loginScreen.style.display = "none";
        editorScreen.style.display = "block";

        await loadMenu();

      } catch (error) {

        githubToken = null;

        loginStatus.textContent =
          `Login failed: ${error.message}`;

        passwordInput.disabled = false;
        passwordInput.focus();

      } finally {

        loginButton.disabled = false;
        passwordInput.disabled = false;

      }

    });


    // ==================================================
    // Logout
    // ==================================================

    logoutButton.addEventListener("click", () => {

      // Remove the token from memory.
      githubToken = null;

      // Clear any currently loaded menu data.
      menuData = [];
      currentSha = null;

      // Hide editor.
      editorScreen.style.display = "none";

      // Show login screen.
      loginScreen.style.display = "block";

      // Clear password field.
      passwordInput.value = "";

      loginStatus.textContent = "";

      passwordInput.focus();

    });


    // ==================================================
    // Load Menu
    // ==================================================

    async function loadMenu() {

      if (!githubToken) {
        throw new Error("You are not logged in.");
      }

      editorStatus.textContent = "Loading menu...";

      try {

        const response = await fetch(
          `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`,
          {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${githubToken}`,
              "Accept": "application/vnd.github+json"
            }
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || `GitHub returned HTTP ${response.status}.`
          );
        }

        currentSha = data.sha;

        const html = atob(data.content.replace(/\n/g, ""));

        menuData = parseHTML(html);

        renderTree();

        editorStatus.textContent = "";

      } catch (error) {

        editorStatus.textContent =
          `Failed to load menu: ${error.message}`;

        console.error(error);

      }

    }


    // ==================================================
    // Parse HTML
    // ==================================================

    function parseHTML(html) {

      const container = document.createElement("div");

      container.innerHTML = html;


      function parseUL(ul) {

        const items = [];

        Array.from(ul.children).forEach(li => {

          if (li.tagName !== "LI") return;

          const a = li.querySelector("a");

          const span = a
            ? a.querySelector("span.menu-text")
            : null;

          const text = span
            ? span.textContent
            : (a ? a.textContent : "");

          const href = a
            ? a.getAttribute("href")
            : "#";

          const subUL = li.querySelector("ul");

          items.push({
            text,
            href,
            children: subUL
              ? parseUL(subUL)
              : []
          });

        });

        return items;

      }


      const topItems = [];

      Array.from(container.children).forEach(node => {

        if (node.tagName === "LI") {

          topItems.push({
            text:
              node.querySelector("span.menu-text")?.textContent || "",

            href:
              node.querySelector("a")?.getAttribute("href") || "#",

            children:
              node.querySelector("ul")
                ? parseUL(node.querySelector("ul"))
                : []
          });

        } else if (node.tagName === "UL") {

          parseUL(node).forEach(item =>
            topItems.push(item)
          );

        }

      });

      return topItems;

    }


    // ==================================================
    // Render Tree
    // ==================================================

    function renderTree() {

      const container =
        document.getElementById("menu-tree");

      container.innerHTML = "";


      function createNode(item, parentArray) {

        const li = document.createElement("li");


        // ----------------------------------------------
        // Up / Down + Inputs Wrapper
        // ----------------------------------------------

        const wrapperDiv =
          document.createElement("div");

        wrapperDiv.className =
          "node-buttons-wrapper";


        // ----------------------------------------------
        // Up / Down Buttons
        // ----------------------------------------------

        const upDownDiv =
          document.createElement("div");

        upDownDiv.className =
          "up-down-buttons";


        const upBtn =
          document.createElement("button");

        upBtn.type = "button";
        upBtn.textContent = "↑";

        upBtn.onclick = () => {

          const index =
            parentArray.indexOf(item);

          if (index > 0) {

            [
              parentArray[index - 1],
              parentArray[index]
            ] =
            [
              parentArray[index],
              parentArray[index - 1]
            ];

            renderTree();

          }

        };


        const downBtn =
          document.createElement("button");

        downBtn.type = "button";
        downBtn.textContent = "↓";

        downBtn.onclick = () => {

          const index =
            parentArray.indexOf(item);

          if (index < parentArray.length - 1) {

            [
              parentArray[index],
              parentArray[index + 1]
            ] =
            [
              parentArray[index + 1],
              parentArray[index]
            ];

            renderTree();

          }

        };


        upDownDiv.appendChild(upBtn);
        upDownDiv.appendChild(downBtn);


        // ----------------------------------------------
        // Node Fields + Action Buttons
        // ----------------------------------------------

        const nodeDiv =
          document.createElement("div");

        nodeDiv.className =
          "node-buttons";


        const textInput =
          document.createElement("input");

        textInput.value = item.text;

        textInput.oninput = () =>
          item.text = textInput.value;


        const hrefInput =
          document.createElement("input");

        hrefInput.value = item.href;

        hrefInput.placeholder = "URL";

        hrefInput.className =
          "link-input";

        hrefInput.oninput = () =>
          item.href = hrefInput.value;


        const addBtn =
          document.createElement("button");

        addBtn.type = "button";
        addBtn.textContent = "Add Sub";

        addBtn.onclick = () => {

          const newItem = {
            text: "New Item",
            href: "#",
            children: []
          };

          item.children.push(newItem);

          renderTree();

        };


        const delBtn =
          document.createElement("button");

        delBtn.type = "button";
        delBtn.textContent = "Delete";

        delBtn.onclick = () => {

          const index =
            parentArray.indexOf(item);

          parentArray.splice(index, 1);

          renderTree();

        };


        nodeDiv.appendChild(textInput);
        nodeDiv.appendChild(hrefInput);
        nodeDiv.appendChild(addBtn);
        nodeDiv.appendChild(delBtn);


        // ----------------------------------------------
        // Combine Wrapper
        // ----------------------------------------------

        wrapperDiv.appendChild(upDownDiv);
        wrapperDiv.appendChild(nodeDiv);

        li.appendChild(wrapperDiv);


        // ----------------------------------------------
        // Children
        // ----------------------------------------------

        if (
          item.children &&
          item.children.length > 0
        ) {

          const ul =
            document.createElement("ul");

          item.children.forEach(child =>
            ul.appendChild(
              createNode(child, item.children)
            )
          );

          li.appendChild(ul);

        }


        return li;

      }


      const ulRoot =
        document.createElement("ul");

      menuData.forEach(item =>
        ulRoot.appendChild(
          createNode(item, menuData)
        )
      );

      container.appendChild(ulRoot);

    }


    // ==================================================
    // Add Top Category
    // ==================================================

    addTopButton.addEventListener("click", () => {

      menuData.push({
        text: "New Category",
        href: "#",
        children: []
      });

      renderTree();

    });


    // ==================================================
    // Convert Tree to HTML
    // ==================================================

    function treeToHTML(items, indent = 0) {

      if (!items || items.length === 0) {
        return "";
      }

      let html = "";

      const spacer =
        "  ".repeat(indent);


      html +=
        indent === 0
          ? ""
          : spacer + "<ul>\n";


      items.forEach(item => {

        html +=
          spacer + "  <li>";

        html +=
          `<a href="${item.href}">` +
          `<span class="menu-text">${item.text}</span>` +
          `</a>\n`;


        if (
          item.children &&
          item.children.length > 0
        ) {

          html +=
            treeToHTML(
              item.children,
              indent + 2
            );

          html +=
            spacer + "  ";

        }


        html += "</li>\n";

      });


      html +=
        indent === 0
          ? ""
          : spacer + "</ul>\n";


      return html;

    }


    // ==================================================
    // Save to GitHub
    // ==================================================

    async function saveTree() {

      if (!githubToken) {

        alert("You are not logged in.");

        return;

      }


      const html =
        treeToHTML(menuData);


      // Encode as UTF-8 before Base64 encoding.
      // This also handles non-ASCII menu text correctly.
      const content =
        btoa(
          unescape(
            encodeURIComponent(html)
          )
        );


      saveButton.disabled = true;

      editorStatus.textContent =
        "Saving menu...";


      try {

        const response = await fetch(
          `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`,
          {
            method: "PUT",

            headers: {
              "Authorization":
                `Bearer ${githubToken}`,

              "Accept":
                "application/vnd.github+json",

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message:
                "Update menu via editor",

              content:
                content,

              sha:
                currentSha
            })

          }
        );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.message ||
            `GitHub returned HTTP ${response.status}.`
          );

        }


        if (result.content) {

          alert(
            "Menu saved successfully!"
          );

          currentSha =
            result.content.sha;

          editorStatus.textContent =
            "";

          // Redirect to main page.
          window.location.href =
            "index.html";

        } else {

          throw new Error(
            "GitHub did not return the expected file information."
          );

        }


      } catch (error) {

        editorStatus.textContent =
          `Save failed: ${error.message}`;

        console.error(error);

        alert(
          `Save failed:\n\n${error.message}`
        );

      } finally {

        saveButton.disabled = false;

      }

    }

  </script>

</body>
</html>
